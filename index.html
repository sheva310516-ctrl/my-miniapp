<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>РАБОТА РЯДОМ | РФ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: 'Segoe UI', Roboto, sans-serif;
  }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #020111 0%, #0b1033 25%, #0f2748 50%, #123a5c 70%, #1b4b6b 85%, #0a1a33 100%);
    background-size: 400% 400%;
    animation: aurora 18s ease infinite;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-top: 14vh;
    padding-left: 20px;
    padding-right: 20px;
    color: #ffffff;
    overflow-x: hidden;
    position: relative;
  }

  body::before, body::after {
    content: "";
    position: fixed;
    top: -20%;
    left: -20%;
    width: 140%;
    height: 140%;
    pointer-events: none;
    z-index: 0;
  }

  body::before {
    background:
      radial-gradient(circle at 20% 30%, rgba(80, 220, 180, 0.12), transparent 40%),
      radial-gradient(circle at 75% 60%, rgba(100, 160, 255, 0.10), transparent 45%);
    animation: float1 12s ease-in-out infinite alternate;
  }

  body::after {
    background:
      radial-gradient(circle at 60% 20%, rgba(140, 100, 255, 0.08), transparent 40%),
      radial-gradient(circle at 30% 80%, rgba(60, 200, 220, 0.08), transparent 45%);
    animation: float2 16s ease-in-out infinite alternate;
  }

  @keyframes aurora {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  @keyframes float1 {
    0%   { transform: translate(0, 0) scale(1); }
    100% { transform: translate(3%, 2%) scale(1.05); }
  }

  @keyframes float2 {
    0%   { transform: translate(0, 0) scale(1); }
    100% { transform: translate(-2%, -3%) scale(1.08); }
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.6; }
  }
</style>

 <style>
  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    padding-bottom: 60px;
  }

  /* Логотип / заголовок */
  .logo-wrap {
    text-align: center;
    animation: fadeInUp 0.8s ease forwards;
  }

  .logo-icon {
    width: 72px;
    height: 72px;
    margin: 0 auto 16px;
    border-radius: 20px;
    background: linear-gradient(135deg, rgba(80, 220, 180, 0.25), rgba(100, 160, 255, 0.2));
    border: 1px solid rgba(255, 255, 255, 0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    backdrop-filter: blur(10px);
  }

  .logo-title {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 1px;
    margin: 0 0 6px;
    background: linear-gradient(90deg, #ffffff, #b0d8ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .logo-subtitle {
    font-size: 14px;
    color: rgba(255, 255, 255, 0.55);
    margin: 0;
  }

  /* Glass-кнопки */
  .btn {
    width: 100%;
    padding: 16px 20px;
    border: none;
    border-radius: 16px;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.2s ease, opacity 0.2s;
    position: relative;
    overflow: hidden;
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.12);
  }

  .btn::before {
    content: "";
    position: absolute;
    inset: 0;
    padding: 1px;
    border-radius: 16px;
    background: linear-gradient(135deg, rgba(80, 220, 180, 0.4), rgba(100, 160, 255, 0.3), transparent);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }

  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(80, 220, 180, 0.15);
  }

  .btn:active {
    transform: translateY(0) scale(0.98);
  }

  .btn-primary {
    background: linear-gradient(135deg, rgba(80, 220, 180, 0.22), rgba(100, 160, 255, 0.18));
  }

  .btn-secondary {
    background: rgba(255, 255, 255, 0.04);
  }

  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  /* Список кнопок */
  .btn-group {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
    animation: fadeInUp 0.8s ease 0.2s forwards;
    opacity: 0;
  }

  /* Формы / экраны */
  .screen {
    width: 100%;
    display: none;
    flex-direction: column;
    gap: 16px;
    animation: fadeInUp 0.5s ease forwards;
  }

  .screen.active {
    display: flex;
  }

  .screen-title {
    font-size: 20px;
    font-weight: 700;
    margin: 0 0 4px;
  }

  .input-group {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .input-group label {
    font-size: 13px;
    color: rgba(255, 255, 255, 0.55);
    font-weight: 500;
  }

  .input, .textarea, .select {
    width: 100%;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(8px);
    color: #fff;
    font-size: 15px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s, background 0.2s;
  }

  .input:focus, .textarea:focus, .select:focus {
    border-color: rgba(80, 220, 180, 0.5);
    background: rgba(255, 255, 255, 0.08);
  }

  .input::placeholder, .textarea::placeholder {
    color: rgba(255, 255, 255, 0.3);
  }

  .textarea {
    resize: vertical;
    min-height: 90px;
  }

  .select option {
    background: #0b1033;
    color: #fff;
  }

  /* Карточка заявки */
  .card {
    width: 100%;
    padding: 18px;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .card-title {
    font-size: 16px;
    font-weight: 600;
    margin: 0;
  }

  .card-price {
    font-size: 16px;
    font-weight: 700;
    color: #50dcb4;
    white-space: nowrap;
  }

  .card-desc {
    font-size: 14px;
    color: rgba(255, 255, 255, 0.6);
    margin: 0;
    line-height: 1.5;
  }

  .card-meta {
    display: flex;
    gap: 14px;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.4);
  }

  .card-meta span {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  /* Спиннер */
  .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid rgba(255, 255, 255, 0.1);
    border-top-color: #50dcb4;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 40px auto;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Тост */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    padding: 14px 24px;
    border-radius: 12px;
    background: rgba(20, 30, 50, 0.95);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: #fff;
    font-size: 14px;
    font-weight: 500;
    z-index: 9999;
    transition: transform 0.3s ease;
    max-width: 360px;
    text-align: center;
  }

  .toast.show {
    transform: translateX(-50%) translateY(0);
  }

  .toast.error {
    border-color: rgba(255, 80, 80, 0.4);
  }

  .toast.success {
    border-color: rgba(80, 220, 180, 0.4);
  }

  /* Пустой список */
  .empty {
    text-align: center;
    color: rgba(255, 255, 255, 0.4);
    font-size: 15px;
    padding: 40px 20px;
  }

  .empty-icon {
    font-size: 40px;
    margin-bottom: 12px;
  }
</style>

 </head>
<body>

<div class="container" id="app">

  <!-- ЭКРАН 1: Титульная страница -->
  <div class="screen active" id="screen-home">
    <div class="logo-wrap">
      <div class="logo-icon">🔧</div>
      <h1 class="logo-title">РАБОТА РЯДОМ</h1>
      <p class="logo-subtitle">Биржа заявок по всей России</p>
    </div>
    <div class="btn-group">
      <button class="btn btn-primary" onclick="goTo('screen-create')">📝 Создать заявку</button>
      <button class="btn btn-secondary" onclick="goTo('screen-list')">📋 Список заявок</button>
      <button class="btn btn-secondary" onclick="goTo('screen-about')">ℹ️ О проекте</button>
    </div>
  </div>

  <!-- ЭКРАН 2: Создание заявки -->
  <div class="screen" id="screen-create">
    <h2 class="screen-title">Создать заявку</h2>

    <div class="input-group">
      <label>Категория</label>
      <select class="select" id="f-category">
        <option value="repair">Ремонт</option>
        <option value="cleaning">Уборка</option>
        <option value="delivery">Доставка</option>
        <option value="transport">Перевозки</option>
        <option value="construction">Строительство</option>
        <option value="it">IT / Компьютеры</option>
        <option value="beauty">Красота / Здоровье</option>
        <option value="other">Другое</option>
      </select>
    </div>

    <div class="input-group">
      <label>Заголовок</label>
      <input class="input" id="f-title" type="text" placeholder="Например: Уложить ламинат 20 м²" maxlength="100">
    </div>

    <div class="input-group">
      <label>Описание</label>
      <textarea class="textarea" id="f-desc" placeholder="Опишите задачу подробнее..." maxlength="500"></textarea>
    </div>

    <div class="input-group">
      <label>Город</label>
      <input class="input" id="f-city" type="text" placeholder="Например: Москва" maxlength="50">
    </div>

    <div class="input-group">
      <label>Бюджет (₽)</label>
      <input class="input" id="f-budget" type="number" placeholder="Например: 5000" min="0">
    </div>

    <div class="btn-group">
      <button class="btn btn-primary" id="btn-submit" onclick="submitRequest()">Опубликовать заявку</button>
      <button class="btn btn-secondary" onclick="goTo('screen-home')">← Назад</button>
    </div>
  </div>

  <!-- ЭКРАН 3: Список заявок -->
  <div class="screen" id="screen-list">
    <h2 class="screen-title">Заявки</h2>
    <div id="list-content">
      <div class="spinner"></div>
    </div>
    <button class="btn btn-secondary" onclick="goTo('screen-home')" style="margin-top: 12px;">← Назад</button>
  </div>

  <!-- ЭКРАН 4: О проекте -->
  <div class="screen" id="screen-about">
    <h2 class="screen-title">О проекте</h2>
    <div class="card">
      <p class="card-desc">
        <strong>РАБОТА РЯДОМ</strong> — биржа заявок, где вы можете быстро
        опубликовать задачу и найти исполнителя поблизости.
      </p>
      <p class="card-desc">
        Заказчики создают заявки, исполнители откликаются.
        Просто, быстро, без посредников.
      </p>
    </div>
    <button class="btn btn-secondary" onclick="goTo('screen-home')">← Назад</button>
  </div>

</div>

<!-- Тост для уведомлений -->
<div class="toast" id="toast"></div>

 <script>
  // ===== Telegram WebApp Init =====
  const tg = window.Telegram && window.Telegram.WebApp;

  if (tg) {
    tg.ready();
    tg.expand();

    // Цветовая интеграция с Telegram
    if (tg.setHeaderColor) tg.setHeaderColor('#0b1033');
    if (tg.setBackgroundColor) tg.setBackgroundColor('#020111');

    // Кнопка "назад" в Telegram
    const backButton = tg.BackButton;
    backButton.onClick(() => {
      const active = document.querySelector('.screen.active');
      if (active && active.id !== 'screen-home') {
        goTo('screen-home');
      } else {
        backButton.hide();
        tg.close();
      }
    });
  }

  // ===== Навигация между экранами =====
  function goTo(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    const screen = document.getElementById(screenId);
    if (screen) {
      screen.classList.add('active');
      window.scrollTo(0, 0);

      // Управление BackButton
      if (tg && tg.BackButton) {
        if (screenId === 'screen-home') {
          tg.BackButton.hide();
        } else {
          tg.BackButton.show();
        }
      }

      // Загрузка списка при переходе
      if (screenId === 'screen-list') {
        loadRequests();
      }
    }
  }

  // ===== Тост-уведомления =====
  let toastTimer = null;
  function showToast(message, type = '') {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.className = 'toast show ' + type;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      toast.className = 'toast ' + type;
    }, 3000);
  }

  // ===== Демо-данные (заменить на серверные) =====
  const demoRequests = [
    { id: 1, category: 'repair',      title: 'Уложить ламинат 20 м²',  desc: 'Комната 20 м², ламинат уже куплен, нужна укладка.', city: 'Москва',     budget: 5000 },
    { id: 2, category: 'cleaning',    title: 'Уборка квартиры',         desc: '2-комнатная квартира, генеральная уборка.',         city: 'Казань',     budget: 3000 },
    { id: 3, category: 'delivery',    title: 'Забрать посылку',          desc: 'Забрать посылку со склада Ozon, отвезти домой.',    city: 'Екатеринбург', budget: 800  },
    { id: 4, category: 'it',          title: 'Настроить роутер',         desc: 'TP-Link, не раздаёт Wi-Fi после сброса.',           city: 'Санкт-Петербург', budget: 1500 },
    { id: 5, category: 'transport',   title: 'Перевезти вещи',           desc: '5 коробок + диван, переезд в соседний район.',      city: 'Новосибирск', budget: 4000 },
  ];

  const categoryLabels = {
    repair: '🔧 Ремонт',
    cleaning: '🧹 Уборка',
    delivery: '📦 Доставка',
    transport: '🚚 Перевозки',
    construction: '🏗 Строительство',
    it: '💻 IT / Компьютеры',
    beauty: '💅 Красота',
    other: '📌 Другое'
  };

  // ===== Загрузка списка заявок =====
  function loadRequests() {
    const container = document.getElementById('list-content');
    container.innerHTML = '<div class="spinner"></div>';

    // Имитация запроса к серверу
    setTimeout(() => {
      // Здесь должен быть fetch() к вашему API:
      // fetch('/api/requests').then(r => r.json()).then(data => { renderList(data); })

      renderList(demoRequests);
    }, 600);
  }

  function renderList(requests) {
    const container = document.getElementById('list-content');

    if (!requests || requests.length === 0) {
      container.innerHTML = `
        <div class="empty">
          <div class="empty-icon">📭</div>
          <p>Пока нет заявок.<br>Будьте первым!</p>
        </div>`;
      return;
    }

    container.innerHTML = requests.map(r => `
      <div class="card" style="margin-bottom: 12px;">
        <div class="card-header">
          <h3 class="card-title">${escapeHtml(r.title)}</h3>
          <span class="card-price">${r.budget ? r.budget.toLocaleString('ru-RU') + ' ₽' : 'договорная'}</span>
        </div>
        <p class="card-desc">${escapeHtml(r.desc)}</p>
        <div class="card-meta">
          <span>📍 ${escapeHtml(r.city)}</span>
          <span>${categoryLabels[r.category] || '📌'}</span>
        </div>
        <button class="btn btn-primary" style="margin-top: 6px;" onclick="respondRequest(${r.id})">Откликнуться</button>
      </div>
    `).join('');
  }

  function respondRequest(id) {
    // Отправка отклика через Telegram
    if (tg && tg.sendData) {
      try {
        tg.sendData(JSON.stringify({ action: 'respond', requestId: id }));
        showToast('Отклик отправлен!', 'success');
      } catch (e) {
        // sendДанные недоступны — fallback
        showToast('Отклик отправлен!', 'success');
      }
    } else {
      showToast('Отклик отправлен!', 'success');
    }
  }

  // ===== Отправка новой заявки =====
  function submitRequest() {
    const data = {
      category: document.getElementById('f-category').value,
      title:    document.getElementById('f-title').value.trim(),
      desc:     document.getElementById('f-desc').value.trim(),
      city:     document.getElementById('f-city').value.trim(),
      budget:   document.getElementById('f-budget').value,
    };

    // Валидация
    if (!data.title)  { showToast('Введите заголовок', 'error'); return; }
    if (!data.desc)   { showToast('Введите описание', 'error'); return; }
    if (!data.city)   { showToast('Введите город', 'error'); return; }

    const btn = document.getElementById('btn-submit');
    btn.disabled = true;
    btn.textContent = 'Отправка...';

    // Здесь должен быть fetch() к вашему API:
    // fetch('/api/requests', { method: 'POST', body: JSON.stringify(data) })

    setTimeout(() => {
      // Добавляем в демо-список
      demoRequests.unshift({
        id: Date.now(),
        ...data,
        budget: data.budget ? parseInt(data.budget) : 0
      });

      // Отправляем данные в Telegram (если доступно)
      if (tg && tg.sendData) {
        try {
          tg.sendData(JSON.stringify({ action: 'create', ...data }));
        } catch (e) {
          // fallback — просто уведомление
        }
      }

      btn.disabled = false;
      btn.textContent = 'Опубликовать заявку';
      showToast('Заявка опубликована!', 'success');

      // Очистка формы
      document.getElementById('f-title').value = '';
      document.getElementById('f-desc').value = '';
      document.getElementById('f-city').value = '';
      document.getElementById('f-budget').value = '';

      // Переход к списку
      setTimeout(() => goTo('screen-list'), 800);
    }, 800);
  }

  // ===== Утилиты =====
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }
</script>

</body>
</html>
